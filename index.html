<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好运抽奖 · 幸运礼物正在等你</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
:root{--ink:#202a27;--muted:#818a81;--paper:#fbfaf7;--green:#214f3d;--lime:#d1f078;--line:#e9e8e1;--orange:#fa9566}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 36px 50px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.4px}.mark{width:34px;height:34px;background:var(--green);color:var(--lime);border-radius:11px;display:grid;place-items:center;font-size:18px}.top-right{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:#7ebc6a;border-radius:50%}.hero{text-align:center;padding:48px 0 30px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#799064;font-weight:700}.hero h1{font-size:44px;line-height:1.15;letter-spacing:-2px;margin:13px 0 10px}.hero h1 span{color:#72934d}.hero p{margin:0;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:20px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #343e2b08}.left{padding:22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section-head h2,.side h2{font-size:15px;margin:0;font-weight:700}.count{font-size:11px;color:var(--muted);background:#f4f4ef;border-radius:20px;padding:6px 10px}.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.prize{border:1px solid var(--line);border-radius:13px;padding:10px;position:relative;min-width:0;transition:.2s}.prize:hover{border-color:#aec88b;transform:translateY(-2px)}.photo{height:115px;border-radius:9px;background:#f5f4ed;display:grid;place-items:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:34px}.upload{position:absolute;bottom:7px;right:7px;width:27px;height:27px;background:#fffffff0;border-radius:8px;display:grid;place-items:center;font-size:14px;cursor:pointer;box-shadow:0 1px 5px #0002}.upload input{display:none}.prize-name{border:0;outline:0;width:100%;font:600 13px inherit;color:var(--ink);padding:10px 1px 2px;background:transparent}.prize-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:white;border-radius:7px;width:23px;height:23px;cursor:pointer;color:var(--ink)}.remove{border:0;background:none;color:#b4b6af;cursor:pointer;font-size:16px}.add{border:1px dashed #d5d8cc;border-radius:13px;min-height:191px;display:grid;place-content:center;text-align:center;gap:8px;color:#819269;cursor:pointer;font-size:12px}.add b{font-size:25px;font-weight:400}.add:hover{background:#fafbf4;border-color:#9cb179}.bottom-row{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.hint{font-size:11px;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 16px;font:600 12px inherit;cursor:pointer}.btn-quiet{background:#f2f3ed;color:#5d6759}.side{padding:21px}.side h2{margin-bottom:17px}.label{font-size:11px;color:#727a71;font-weight:600;margin-bottom:8px}.textarea{width:100%;height:132px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.8 inherit;outline:none;color:var(--ink);background:#fdfdfb}.textarea:focus,input:focus{border-color:#91a976}.row{display:flex;gap:12px;margin-top:16px}.field{flex:1}.field input{width:100%;height:39px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font:13px inherit;outline:none}.draw{width:100%;margin-top:18px;background:var(--green);color:white;font-size:14px;font-weight:700;padding:15px;border-radius:11px;box-shadow:0 5px 12px #214f3d20}.draw:hover{background:#2d654d}.draw:disabled{opacity:.5;cursor:not-allowed}.draw span{color:var(--lime);padding-right:7px}.result{margin-top:16px;border-radius:12px;background:#f5f7ee;padding:14px;display:none}.result.show{display:block}.result-top{display:flex;justify-content:space-between;font-size:11px;color:#748064;margin-bottom:10px}.winner{background:white;border-radius:9px;padding:10px;margin-top:7px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.winner strong{font-size:13px}.winner em{font-style:normal;color:#8b9b66;font-size:11px}.footer{display:flex;justify-content:center;gap:7px;align-items:center;color:#a0a39a;font-size:10px;margin-top:24px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#29352e;color:white;padding:11px 17px;border-radius:10px;font-size:12px;transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.shell{padding:18px 16px 35px}.hero{padding:35px 0 24px}.hero h1{font-size:34px}.layout{grid-template-columns:1fr}.prizes{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.prizes{grid-template-columns:1fr 1fr}.photo{height:100px}.add{min-height:177px}.hero h1{font-size:30px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark">✳</div>好运抽奖 <span style="font-weight:400;color:#8b9288">/ GOOD LUCK CLUB</span></div><div class="top-right"><span class="dot"></span>数据仅保存在此设备</div></header><section class="hero"><div class="eyebrow">A LITTLE LUCK GOES A LONG WAY</div><h1>让好运，<span>落在你手上。</span></h1><p>添加礼物、导入名单，剩下的交给一点点好运气。</p></section><main class="layout"><section class="card left"><div class="section-head"><h2>🎁 &nbsp;本次奖品</h2><span class="count" id="prizeCount">3 款礼物 · 共 6 份</span></div><div class="prizes" id="prizes"></div><div class="bottom-row"><span class="hint">点击图片角标上传礼物照片 · 数量可自由调整</span><button class="btn btn-quiet" id="clearBtn">清空奖品</button></div></section><aside class="card side"><h2>👥 &nbsp;参与抽奖</h2><div class="label">参与者名单 <span style="font-weight:400;color:#a0a39a">· 每行一位</span></div><textarea class="textarea" id="names" placeholder="输入名字，每行一位&#10;例如：&#10;林小满&#10;周一一&#10;陈可乐"></textarea><div class="row"><div class="field"><div class="label">抽取人数</div><input id="drawQty" type="number" min="1" value="1"></div><div class="field"><div class="label">抽取方式</div><input value="中奖者不重复" disabled style="background:#fafaf7;color:#858c81"></div></div><button class="btn draw" id="draw"><span>✦</span> 开始抽奖</button><div class="result" id="result"><div class="result-top"><b>本次幸运名单</b><span id="resultMeta"></span></div><div id="winners"></div></div></aside></main><div class="footer">✳ &nbsp;祝你今天，也有好事发生。</div></div><div class="toast" id="toast"></div><script>
const defaults=[{name:'复古拍立得',qty:1,emoji:'📷'},{name:'周末野餐篮',qty:2,emoji:'🧺'},{name:'一点好心情',qty:3,emoji:'🌼'}];let prizes=[];try{prizes=JSON.parse(localStorage.getItem('luck_prizes'))||defaults}catch{prizes=defaults}let history=[];try{history=JSON.parse(localStorage.getItem('luck_history'))||[]}catch{}
const $=s=>document.querySelector(s);function save(){localStorage.setItem('luck_prizes',JSON.stringify(prizes));localStorage.setItem('luck_history',JSON.stringify(history))}function render(){const host=$('#prizes');host.innerHTML='';prizes.forEach((p,i)=>{let card=document.createElement('div');card.className='prize';card.innerHTML=`<div class="photo">${p.image?`<img src="${p.image}">`:`<span class="placeholder">${p.emoji||'🎁'}</span>`}<label class="upload" title="上传图片">＋<input type="file" accept="image/*"></label></div><input class="prize-name" value="${esc(p.name)}" aria-label="礼物名称"><div class="prize-foot"><div class="qty"><button data-do="minus">−</button><b>${p.qty}</b><button data-do="plus">＋</button><span>份</span></div><button class="remove" title="删除">×</button></div>`;card.querySelector('.prize-name').onchange=e=>{p.name=e.target.value;save()};card.querySelector('.remove').onclick=()=>{prizes.splice(i,1);save();render()};card.querySelector('[data-do=minus]').onclick=()=>{p.qty=Math.max(1,p.qty-1);save();render()};card.querySelector('[data-do=plus]').onclick=()=>{p.qty++;save();render()};card.querySelector('input[type=file]').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{p.image=reader.result;save();render()};reader.readAsDataURL(f)};host.append(card)});let add=document.createElement('button');add.className='add';add.innerHTML='<b>＋</b>添加一份礼物';add.onclick=()=>{prizes.push({name:'新礼物',qty:1,emoji:'🎁'});save();render()};host.append(add);let total=prizes.reduce((a,p)=>a+ +p.qty,0);$('#prizeCount').textContent=`${prizes.length} 款礼物 · 共 ${total} 份`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}$('#clearBtn').onclick=()=>{prizes=[];save();render()};$('#draw').onclick=()=>{let people=$('#names').value.split(/\n|,|，/).map(s=>s.trim()).filter(Boolean);let n=Math.floor(+$ ('#drawQty').value);if(!prizes.length)return toast('请先添加至少一份礼物');if(!people.length)return toast('请先输入参与者名单');if(!n||n<1)return toast('请输入有效的抽取人数');if(n>people.length)return toast(`参与者只有 ${people.length} 位，无法抽取 ${n} 人`);let pool=[...people],picked=[];for(let i=0;i<n;i++)picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);let inventory=prizes.flatMap(p=>Array.from({length:Math.max(0,Math.floor(+p.qty))},()=>p.name));picked.forEach((name,i)=>{let prize=inventory.length?inventory.splice(Math.floor(Math.random()*inventory.length),1)[0]:'幸运大奖';history.unshift({name,prize,time:new Date().toLocaleString('zh-CN',{hour12:false})})});$('#resultMeta').textContent=`${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · ${n} 位`;$('#winners').innerHTML=picked.map((name,i)=>`<div class="winner"><strong>🎉 ${esc(name)}</strong><em>${esc(inventory.length||prizes.length? '恭喜中奖':'幸运参与')}</em></div>`).join('');$('#result').classList.add('show');save()};render();
</script></body></html>
