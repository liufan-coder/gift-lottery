<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfaf7"><title>给你的生日礼物</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');:root{--ink:#27302b;--muted:#858a82;--paper:#fbfaf7;--green:#315b49;--rose:#df9a9b;--line:#ebe8df;--cream:#f4f0e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:'DM Sans','Noto Sans SC',sans-serif}.wrap{max-width:970px;margin:auto;padding:25px 28px 48px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:#e7ede4;color:var(--green);font-size:17px}.manage{font-size:11px;color:#9a9b91;text-decoration:none}.manage:hover{color:var(--green)}.hero{text-align:center;padding:64px 0 27px}.kicker{font-size:10px;letter-spacing:2.5px;color:#a78178;font-weight:700}.hero h1{font-size:clamp(30px,6vw,47px);letter-spacing:-1.8px;line-height:1.2;margin:14px 0 12px}.hero h1 em{font-style:normal;color:#b17f76}.hero p{font-size:13px;color:var(--muted);margin:0}.card{max-width:700px;margin:auto;background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 40px #32301b0a}.label{font-size:11px;color:#858a82;font-weight:600;margin:0 0 12px}.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gift{border:1px solid #eeeae2;border-radius:13px;overflow:hidden;background:#fdfcf9}.gift img{width:100%;height:145px;object-fit:cover;display:block;background:var(--cream)}.gift .emoji{height:145px;display:grid;place-items:center;background:var(--cream);font-size:38px}.gift-name{padding:10px 9px 11px;text-align:center;font-size:12px;font-weight:600}.center{text-align:center;padding:22px 0 5px}.draw{border:0;border-radius:12px;background:var(--green);color:white;padding:15px 38px;font:700 14px inherit;cursor:pointer;box-shadow:0 7px 18px #315b4924;transition:.2s}.draw:hover{background:#244a39;transform:translateY(-1px)}.draw:disabled{opacity:.55;cursor:wait;transform:none}.subhint{font-size:10px;color:#9a9b91;margin-top:10px}.result{max-width:700px;margin:18px auto 0;padding:18px;border:1px solid #e4e9dd;border-radius:15px;background:#f6f8f1;text-align:center;display:none}.result.on{display:block;animation:appear .35s ease}.result .spark{font-size:24px}.result h2{font-size:12px;color:#849073;margin:8px 0}.result strong{display:block;font-size:24px;color:var(--green)}.share{font-size:11px;color:var(--muted);margin:10px 0 0}.footer{text-align:center;color:#aaa89f;font-size:10px;margin-top:24px}.admin-wrap{max-width:850px}.admin-hero{text-align:center;padding:40px 0 25px}.admin-hero h1{font-size:30px;margin:0 0 8px}.admin-hero p{font-size:12px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.panel h2{font-size:14px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#eff2e9;color:var(--green);font-weight:600;font:600 12px inherit}.btn.primary{background:var(--green);color:#fff}.btn.danger{color:#a04d4e;background:#fbefed}.items{display:grid;gap:9px}.item{display:grid;grid-template-columns:64px 1fr auto auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px}.thumb{width:64px;height:58px;border-radius:8px;background:var(--cream);object-fit:cover;display:grid;place-items:center;font-size:24px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.item input[type=text]{width:100%;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;font:13px inherit}.item input[type=number]{width:68px;padding:8px;border:1px solid var(--line);border-radius:8px;font:13px inherit}.item-actions{display:flex;gap:6px}.small{border:1px solid var(--line);background:white;border-radius:7px;padding:7px;cursor:pointer;font-size:11px}.history{display:grid;gap:7px}.record{font-size:12px;background:#faf9f5;border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:10px}.muted{font-size:11px;color:var(--muted)}.auth{max-width:400px;margin:45px auto;background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.auth h2{font-size:15px}.auth input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:7px 0 12px;font-size:14px}.notice{font-size:11px;color:var(--muted);line-height:1.6}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#303b34;color:white;border-radius:9px;padding:10px 15px;font-size:12px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:560px){.wrap{padding:17px 14px 35px}.hero{padding:45px 0 24px}.card{padding:12px}.gifts{gap:7px}.gift img,.gift .emoji{height:105px}.gift-name{font-size:10px;padding:8px 5px}.draw{width:100%;padding:15px}.item{grid-template-columns:48px 1fr auto}.thumb{width:48px;height:48px}.item-actions{grid-column:2/4;justify-content:flex-end}.item input[type=number]{width:58px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const API='/api';const app=document.querySelector('#app');const toast=m=>{let t=document.querySelector('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2300)};async function req(path,opts={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'请求失败');return j}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const head=(admin=false)=>`<header class="top"><div class="brand"><span class="logo">✿</span>${admin?'礼物管理':'给你的生日礼物'}</div><a class="manage" href="${admin?'/':'/admin'}">${admin?'返回抽礼物页':'管理入口'}</a></header>`;
async function home(){let {gifts}=await req('/gifts');app.innerHTML=`<div class="wrap">${head()}<section class="hero"><div class="kicker">A LITTLE BIRTHDAY SURPRISE</div><h1>给你的生日礼物，<em>由你来选。</em></h1><p>愿这份小小的惊喜，刚好是你喜欢的。</p></section><section class="card"><p class="label">为你准备的小礼物</p><div class="gifts">${gifts.map(g=>`<div class="gift">${g.image?`<img src="${g.image}" alt="${esc(g.name)}">`:`<div class="emoji">${esc(g.emoji||'🎁')}</div>`}<div class="gift-name">${esc(g.name)}</div></div>`).join('')}</div><div class="center"><button class="draw" id="draw">✦ &nbsp;抽取我的礼物</button><div class="subhint">闭上眼睛，想一个生日愿望吧</div></div></section><section class="result" id="result"><div class="spark">🎉</div><h2>你的生日礼物是</h2><strong id="winner"></strong><p class="share" id="share"></p></section><div class="footer">愿新的一岁，温柔又闪亮。 ✿</div></div>`;document.querySelector('#draw').onclick=async e=>{let b=e.currentTarget;b.disabled=true;b.textContent='正在为你揭晓…';try{let out=await req('/draw',{method:'POST',body:'{}'});document.querySelector('#winner').textContent=out.gift.name;document.querySelector('#share').textContent='抽选结果已送达，记得告诉寿星本人哦。';document.querySelector('#result').classList.add('on');b.textContent='再抽一次';b.disabled=false}catch(err){toast(err.message);b.textContent='✦  抽取我的礼物';b.disabled=false}}}
function login(){app.innerHTML=`<div class="wrap admin-wrap">${head(true)}<section class="auth"><h2>管理礼物和抽奖结果</h2><p class="notice">请输入管理密码。登录后可编辑礼物名称、图片、库存，并查看抽选记录。</p><input id="pw" type="password" placeholder="管理密码"><button class="btn primary" id="login" style="width:100%">进入管理</button></section></div>`;document.querySelector('#login').onclick=async()=>{try{let o=await req('/admin/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#pw').value})});sessionStorage.setItem('adminToken',o.token);admin()}catch(e){toast(e.message)}};document.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')document.querySelector('#login').click()}}
async function admin(){let token=sessionStorage.getItem('adminToken');if(!token)return login();let headers={Authorization:'Bearer '+token};try{let [{gifts},{draws}]=await Promise.all([req('/gifts'),req('/admin/draws',{headers})]);app.innerHTML=`<div class="wrap admin-wrap">${head(true)}<section class="admin-hero"><h1>礼物管理</h1><p>调整礼物内容和库存，朋友抽中的礼物会自动记录在这里。</p></section><section class="panel"><h2>礼物清单</h2><div class="items" id="items">${gifts.map(g=>item(g)).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn" id="add">＋ 添加礼物</button><button class="btn primary" id="save">保存修改</button></div></section><section class="panel"><h2>抽选记录 <span class="muted">· 最新在前</span></h2><div class="history">${draws.length?draws.map(d=>`<div class="record"><span>🎉 ${esc(d.giftName||d.gift_name)}</span><span class="muted">${new Date(d.createdAt||d.created_at).toLocaleString('zh-CN')}</span></div>`).join(''):'<div class="muted">还没有抽选记录。</div>'}</div></section><div class="toolbar"><button class="btn" id="logout">退出管理</button></div></div>`;document.querySelectorAll('.upload-image').forEach(x=>x.onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('图片请控制在 2MB 以内');return}let data=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});e.target.closest('.item').dataset.image=data;e.target.closest('.thumb').innerHTML=`<img src="${data}">`});document.querySelectorAll('.delete').forEach(x=>x.onclick=e=>e.currentTarget.closest('.item').remove());document.querySelector('#add').onclick=()=>{document.querySelector('#items').insertAdjacentHTML('beforeend',item({id:'new-'+Date.now(),name:'新礼物',qty:1,emoji:'🎁'}))};document.querySelector('#save').onclick=async()=>{let next=[...document.querySelectorAll('.item')].map(el=>({id:el.dataset.id.startsWith('new-')?null:Number(el.dataset.id)||null,name:el.querySelector('[data-name]').value.trim(),qty:Math.max(0,Number(el.querySelector('[data-qty]').value)||0),image:el.dataset.image||el.dataset.originalImage||null,emoji:el.dataset.emoji||'🎁'})).filter(g=>g.name);try{await req('/admin/gifts',{method:'PUT',headers,body:JSON.stringify({gifts:next})});toast('礼物已保存');admin()}catch(e){toast(e.message)}};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('adminToken');login()}}catch(e){if(e.message==='管理身份已失效')login();else{app.innerHTML=`<div class="wrap admin-wrap">${head(true)}<div class="panel">${esc(e.message)}</div></div>`}}}
function item(g){return `<div class="item" data-id="${esc(g.id)}" data-image="${esc(g.image||'')}" data-original-image="${esc(g.image||'')}" data-emoji="${esc(g.emoji||'🎁')}"><div class="thumb">${g.image?`<img src="${g.image}">`:esc(g.emoji||'🎁')}</div><input type="text" data-name value="${esc(g.name)}" aria-label="礼物名称"><input type="number" data-qty min="0" value="${Number(g.qty)}" aria-label="库存数量"><div class="item-actions"><label class="small">更换图片<input class="upload-image" type="file" accept="image/*" hidden></label><button class="small delete">删除</button></div></div>`}if(location.pathname==='/admin')admin();else home().catch(e=>{app.innerHTML=`<div class="wrap"><section class="panel">${esc(e.message)}</section></div>`});
</script></body></html>
